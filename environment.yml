# conda environment for branch PY-103.
#
# conda can create a python=3.9.23 environment from conda-forge, but
# conda.anaconda.org and repo.anaconda.com are both 403 at the egress
# proxy of the host this corpus was built on, so no solved lock could
# be produced here. This file is complete and solves on a machine with
# access. Run:
#
#   conda env create -f environment.yml
#   conda activate orderlab-py-103
#   conda list --explicit > conda-lock.txt
#
# and commit conda-lock.txt to close the gap.
name: orderlab-py-103
channels:
  - conda-forge
  - defaults
dependencies:
  - python==3.10.18
  - pip==26.2.1
  - pip:
      - -r requirements-runtime.txt
      - -r requirements-dev.txt

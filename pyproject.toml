# orderlab -- branch PY-093
# Build backend : poetry-core 2.2.1
# Package manager: uv 0.12.9
# Interpreter    : CPython 3.9.23
#
# poetry-core 2.2.1 -- the newest release admitting Python 3.9, and the first release from the 2.x line usable anywhere in this corpus. 2.x emits PEP 621 [project] rather than [tool.poetry], which is exactly what the 3.8 family lacked: it is the single change that makes the poetry-core + uv pairing work and closes the last gap in the grid.
# uv 0.12.9 runs here at the current latest, not a rollback. Verified in-session: `uv venv` succeeds, `uv pip install` resolves, `uv lock` produces a lockfile, and `uv python install 3.9` installs a managed CPython 3.9.23 in seconds. uv also drives the poetry-core branches on this family, because poetry-core 2.2.1 emits PEP 621 -- the one thing that blocked that pairing on the earlier families.

[build-system]
requires = ["poetry-core==2.2.1"]
build-backend = "poetry.core.masonry.api"

# poetry-core 2.2.1 is from the 2.x line, which emits PEP 621 [project]
# instead of [tool.poetry]. Every earlier family in this corpus was
# stuck on poetry-core 1.x, where the absence of [project] is what
# made a poetry-core + uv branch impossible to lock. [tool.poetry]
# survives here only for the packages table, which PEP 621 has no
# equivalent for.
[project]
name = "orderlab"
version = "1.0.0"
description = "Order pricing domain used as a white-box tool-evaluation fixture"
readme = "README.md"
requires-python = "==3.9.23"
license = { text = "MIT" }
authors = [{ name = "Prajith Kumaravel", email = "prajith.k19022003@gmail.com" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "requests==2.31.0",
    "Jinja2==3.1.3",
    "urllib3==2.0.6",
    "cryptography==42.0.0",
    "paramiko==2.4.1",
    "six==1.17.0"
]

[project.scripts]
orderlab = "orderlab.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
    "crosshair-tool==0.0.110 ; python_version >= '3.8'",
    "coverage==7.16.0 ; python_version >= '3.10'",
    "pymcdc==0.2.6 ; python_version >= '3.10'",
    "radon==6.0.1",
    "lizard==1.24.0",
    "pytest-testmon==2.2.0 ; python_version >= '3.10'",
    "pylint==4.0.8 ; python_version >= '3.10'",
    "semgrep==1.176.0 ; python_version >= '3.10'",
    "bandit==1.9.4 ; python_version >= '3.10'",
    "pip-audit==2.10.1 ; python_version >= '3.10'",
    "cosmic-ray==8.7.0 ; python_version >= '3.9'",
    "beniget==0.5.0 ; python_version >= '3.6'",
    "gast==0.7.0 ; python_version >= '3.6'",
    "pydriller==2.10 ; python_version >= '3.5'",
    "ruff==0.16.5 ; python_version >= '3.7'",
    "complexipy==7.0.1 ; python_version >= '3.8'",
    "slipcover==1.1.0 ; python_version >= '3.9'",
    "mutmut==3.7.0 ; python_version >= '3.10'",
    "diff-cover==10.5.1 ; python_version >= '3.10'",
    "astroid==4.3.1 ; python_version >= '3.10'",
    "pyan3==2.8.1 ; python_version >= '3.10'",
    "vulture==2.16 ; python_version >= '3.9'",
    "dulwich==1.2.14 ; python_version >= '3.10'",
]

[tool.poetry]
packages = [{ include = "orderlab", from = "src" }]

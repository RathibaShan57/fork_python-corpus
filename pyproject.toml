# orderlab -- branch PY-023
# Build backend : poetry-core 1.0.8
# Package manager: conda (solver-resolved)
# Interpreter    : CPython 3.6.15
#
# poetry-core 1.0.8 -- last release admitting Python 3.6. Predates poetry-core 2, so metadata lives in [tool.poetry], not PEP 621 [project].
# conda can create a python=3.6.15 environment from conda-forge, but conda.anaconda.org and repo.anaconda.com are 403 at this build host's egress proxy, so no solved lock could be produced here. environment.yml is complete and solves on the operator's machine.

[build-system]
requires = ["poetry-core==1.0.8"]
build-backend = "poetry.core.masonry.api"

# poetry-core 1.0.8 predates poetry-core 2, so metadata lives in
# [tool.poetry] rather than PEP 621 [project].
[tool.poetry]
name = "orderlab"
version = "1.0.0"
description = "Order pricing domain used as a white-box tool-evaluation fixture"
authors = ["Prajith Kumaravel <prajith.k19022003@gmail.com>"]
license = "MIT"
readme = "README.md"
packages = [{ include = "orderlab", from = "src" }]

[tool.poetry.dependencies]
python = "==3.6.15"
requests = "2.20.0"
Jinja2 = "2.10"
urllib3 = "1.24.1"
cryptography = "2.3"
paramiko = "2.4.1"

[tool.poetry.dev-dependencies]
pytest = "7.0.1"
crosshair-tool = { version = "0.0.110", python = ">=3.8" }
coverage = { version = "7.16.0", python = ">=3.10" }
pymcdc = { version = "0.2.6", python = ">=3.10" }
radon = "6.0.1"
lizard = "1.24.0"
pytest-testmon = { version = "2.2.0", python = ">=3.10" }
pylint = { version = "4.0.8", python = ">=3.10" }
semgrep = { version = "1.176.0", python = ">=3.10" }
bandit = { version = "1.9.4", python = ">=3.10" }
pip-audit = { version = "2.10.1", python = ">=3.10" }
cosmic-ray = { version = "8.7.0", python = ">=3.9" }
beniget = { version = "0.5.0", python = ">=3.6" }
gast = { version = "0.7.0", python = ">=3.6" }
pydriller = { version = "2.10", python = ">=3.5" }
ruff = { version = "0.16.5", python = ">=3.7" }
complexipy = { version = "7.0.1", python = ">=3.8" }
slipcover = { version = "1.1.0", python = ">=3.9" }
mutmut = { version = "3.7.0", python = ">=3.10" }
diff-cover = { version = "10.5.1", python = ">=3.10" }
astroid = { version = "4.3.1", python = ">=3.10" }
pyan3 = { version = "2.8.1", python = ">=3.10" }
vulture = { version = "2.16", python = ">=3.9" }
dulwich = { version = "1.2.14", python = ">=3.10" }

[tool.poetry.scripts]
orderlab = "orderlab.__main__:main"

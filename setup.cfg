[metadata]
name = orderlab
version = 1.0.0
description = Order pricing domain used as a white-box tool-evaluation fixture
long_description = file: README.md
long_description_content_type = text/markdown
author = Prajith Kumaravel
author_email = prajith.k19022003@gmail.com
license = MIT
classifiers =
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.6
    Intended Audience :: Developers
    Topic :: Software Development :: Quality Assurance

[options]
package_dir =
    = src
packages = find:
python_requires = ==3.6.15
install_requires =
    requests==2.20.0
    Jinja2==2.10
    urllib3==1.24.1
    cryptography==2.3
    paramiko==2.4.1

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    orderlab = orderlab.__main__:main


[mutmut]
paths_to_mutate = src/orderlab/
tests_dir = tests/
runner = python -m pytest -x -q

[tool:pytest]
testpaths = tests
